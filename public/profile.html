<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Profile — Vidzly</title><meta name="theme-color" content="#0a0a0f" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" /><link rel="stylesheet" href="/css/style.css" /></head>
<body>
<div id="app-shell"></div>
<script src="/js/app.js"></script>
<script>
const content = requireShell('Profile');
content.innerHTML = `<div class="card" style="max-width:420px;text-align:center;padding:36px 24px;">
  <div style="width:72px;height:72px;border-radius:50%;background:var(--gradient-brand);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:26px;font-weight:700;color:#fff;" id="pf-avatar"></div>
  <h2 id="pf-name" style="font-size:19px;"></h2>
  <p class="text-secondary text-sm" id="pf-email"></p>
  <a href="/settings.html" class="btn-secondary mt-16">Edit profile</a>
</div>`;
Api.get('/api/auth/me').then(({ user }) => {
  document.getElementById('pf-avatar').textContent = (user.name || 'C').slice(0,1).toUpperCase();
  document.getElementById('pf-name').textContent = user.name;
  document.getElementById('pf-email').textContent = user.email + (user.isDemo ? ' (Demo Mode)' : '');
});
</script>
</body></html>
