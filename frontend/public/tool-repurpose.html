<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Content Repurpose — Vidzly</title><meta name="theme-color" content="#0a0a0f" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" /><link rel="stylesheet" href="/css/style.css" /></head>
<body>
<div id="app-shell"></div>
<script src="/js/app.js"></script>
<script>
const content = requireShell('Content Repurpose');
content.innerHTML = `<div class="grid grid--2col" style="align-items:start;">
  <div class="card">
    <p class="text-secondary text-sm mb-16">Turn one long video into quote cards, a YouTube description, and social posts — all at once.</p>
    <div class="field-group"><label class="field-label">Topic / transcript summary</label><textarea class="textarea-input" id="topic" placeholder="Paste a summary of your video's content"></textarea></div>
    <button class="btn-primary btn-block" id="btn-generate">✨ Repurpose content</button>
  </div>
  <div class="card" id="result" style="min-height:200px;"><p class="text-secondary text-sm">Results will appear here.</p></div>
</div>`;
document.getElementById('btn-generate').addEventListener('click', async () => {
  const topic = document.getElementById('topic').value.trim();
  if (!topic) return showToast('Enter your content topic first.', 'error');
  const btn = document.getElementById('btn-generate'); btn.disabled = true; btn.textContent = 'Generating…';
  const result = document.getElementById('result'); result.innerHTML = '<div class="skeleton" style="height:160px;"></div>';
  try {
    const r = await Api.post('/api/ai/repurpose', { topic });
    result.innerHTML = `
      <div class="mb-16"><div class="text-muted text-sm font-semibold mb-8">Quote Cards</div>${r.quoteCards.map(q => `<div class="card" style="background:var(--bg-surface-2);margin-bottom:8px;font-style:italic;">${escapeHtml(q)}</div>`).join('')}</div>
      <div class="mb-16"><div class="text-muted text-sm font-semibold mb-8">YouTube Description</div><p class="text-sm">${escapeHtml(r.youtubeDescription)}</p></div>
      <div><div class="text-muted text-sm font-semibold mb-8">Threads/X Posts</div>${r.socialPosts.map(p => `<div class="text-sm" style="padding:6px 0;border-bottom:1px solid var(--border-subtle);">${escapeHtml(p)}</div>`).join('')}</div>
    `;
  } catch (err) { showToast(err.message, 'error'); }
  finally { btn.disabled = false; btn.textContent = '✨ Repurpose content'; }
});
</script>
</body></html>
