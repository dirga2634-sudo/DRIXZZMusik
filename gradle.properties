# Project-wide Gradle settings for Gomouse Pro.

# JVM heap for the Gradle daemon.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8

# Speed up builds with the parallel executor and the build cache.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is required; Gomouse Pro does not use the old support library.
android.useAndroidX=true

# Do not automatically pull androidx.* replacements for legacy support-lib
# artifacts we never reference.
android.enableJetifier=false

# Only build the ABIs we actually ship for (keeps CI + APK size sane;
# Gomouse Pro has no native code, but this keeps resource packaging fast).
android.nonTransitiveRClass=true

# Official Gradle wrapper distribution used by this project (see
# gradle/wrapper/gradle-wrapper.properties). Declared here too so tooling
# that reads gradle.properties can see the intended version at a glance.
gomouse.gradleVersion=9.5.0
gomouse.agpVersion=9.3.0
