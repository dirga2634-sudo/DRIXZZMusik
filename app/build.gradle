plugins {
    id 'com.android.application'
}

// ---------------------------------------------------------------------------
// Release signing: read from either a local (git-ignored) keystore.properties
// file OR from environment variables (as set by .github/workflows/release.yml
// from GitHub Secrets). If neither is present, NO signingConfig is attached
// to the release build type — AGP will simply produce an unsigned release
// APK. We intentionally never fabricate a fake/debug signing config for
// "release" builds; see README.md "Membuat release APK bertanda tangan".
// ---------------------------------------------------------------------------
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasLocalKeystoreProps = keystorePropertiesFile.exists()
if (hasLocalKeystoreProps) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def envKeystorePath = System.getenv("GOMOUSE_KEYSTORE_PATH")
def hasEnvKeystore = envKeystorePath != null && !envKeystorePath.trim().isEmpty() && new File(envKeystorePath).exists()

def hasReleaseSigning = hasLocalKeystoreProps || hasEnvKeystore

// CI can override the version via -PversionCode=NN -PversionName=x.y.z
def ciVersionCode = project.hasProperty('versionCode') ? (project.property('versionCode') as Integer) : 1
def ciVersionName = project.hasProperty('versionName') ? project.property('versionName').toString() : "1.0.0"

android {
    namespace 'com.gomouse.pro'
    compileSdk 35
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.gomouse.pro"
        minSdk 26
        targetSdk 35
        versionCode ciVersionCode
        versionName ciVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                if (hasEnvKeystore) {
                    storeFile file(envKeystorePath)
                    storePassword System.getenv("KEYSTORE_PASSWORD")
                    keyAlias System.getenv("KEY_ALIAS")
                    keyPassword System.getenv("KEY_PASSWORD")
                } else {
                    storeFile file(keystoreProperties['storeFile'])
                    storePassword keystoreProperties['storePassword']
                    keyAlias keystoreProperties['keyAlias']
                    keyPassword keystoreProperties['keyPassword']
                }
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            // No 'else' branch: with no signingConfig assigned, AGP produces
            // app-release-unsigned.apk. This is expected until real signing
            // secrets are configured — see README troubleshooting section.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
