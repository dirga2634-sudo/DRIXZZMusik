<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Editor — Vidzly</title>
<meta name="theme-color" content="#0a0a0f" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="app-shell"></div>
<script src="/js/app.js"></script>
<script>
const content = requireShell('Editor');
const params = new URLSearchParams(location.search);
const clipId = params.get('clip');
const projectId = params.get('project');
let clip = null;
let state = { trimStart: 0, trimEnd: 0, aspectRatio: '9:16', volume: 1, speed: 1, captionsOn: true, captionStyle: 'bold' };

content.innerHTML = `
  <div class="editor-layout">
    <div class="editor-panel editor-assets">
      <div class="editor-tool-tabs">
        <button class="is-active" data-tool="text">Text</button>
        <button data-tool="captions">Captions</button>
        <button data-tool="effects">Effects</button>
      </div>
      <div id="tool-panel"></div>
    </div>

    <div class="editor-preview" id="editor-preview">
      <div class="skeleton" style="width:60%;height:80%;"></div>
    </div>

    <div class="editor-panel editor-properties">
      <div class="section-title">Properties</div>
      <div class="field-group">
        <label class="field-label">Aspect Ratio</label>
        <div class="flex gap-8">
          <button class="btn-secondary" data-ratio="9:16" style="flex:1;">9:16</button>
          <button class="btn-secondary" data-ratio="16:9" style="flex:1;">16:9</button>
          <button class="btn-secondary" data-ratio="1:1" style="flex:1;">1:1</button>
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">Speed: <span id="speed-val">1.0x</span></label>
        <input type="range" id="speed-slider" min="0.5" max="2" step="0.1" value="1" style="width:100%;" />
      </div>
      <div class="field-group">
        <label class="field-label">Volume: <span id="volume-val">100%</span></label>
        <input type="range" id="volume-slider" min="0" max="2" step="0.1" value="1" style="width:100%;" />
      </div>
      <div class="field-group">
        <label class="field-label">Caption Style</label>
        <select id="caption-style-select" class="select-input">
          <option value="classic">Classic</option><option value="bold" selected>Bold</option><option value="karaoke">Karaoke</option>
          <option value="highlight">Highlight</option><option value="minimal">Minimal</option><option value="creator">Creator</option>
        </select>
      </div>
      <button class="btn-primary btn-block mt-16" id="btn-export">Export video</button>
    </div>

    <div class="editor-panel editor-timeline">
      <div class="timeline-toolbar">
        <button class="btn-secondary" id="tool-split">✂️ Split</button>
        <button class="btn-secondary" id="tool-trim">Trim to selection</button>
        <button class="btn-secondary" id="tool-delete">🗑️ Delete</button>
        <button class="btn-secondary" id="tool-duplicate">⧉ Duplicate</button>
        <div class="topbar__spacer"></div>
        <span class="text-sm text-muted" id="timeline-range"></span>
      </div>
      <div class="timeline-track"><span class="timeline-track__label">Video</span><div class="timeline-track__body" id="track-video"><div class="timeline-clip" id="clip-video" style="left:0;width:100%;">Main clip</div></div></div>
      <div class="timeline-track"><span class="timeline-track__label">Audio</span><div class="timeline-track__body" id="track-audio"><div class="timeline-clip timeline-clip--audio" style="left:0;width:100%;">Audio</div></div></div>
      <div class="timeline-track"><span class="timeline-track__label">Subtitle</span><div class="timeline-track__body" id="track-subtitle"><div class="timeline-clip timeline-clip--caption" style="left:0;width:100%;">Auto captions</div></div></div>
      <div class="timeline-track"><span class="timeline-track__label">Text</span><div class="timeline-track__body" id="track-text"></div></div>
    </div>
  </div>
`;

const toolPanels = {
  text: `<button class="btn-secondary btn-block mb-16">+ Add text</button><div class="field-group"><label class="field-label">Font</label><select class="select-input"><option>Inter</option><option>Space Grotesk</option><option>Poppins</option></select></div><div class="field-group"><label class="field-label">Size</label><input type="range" min="12" max="96" value="32" style="width:100%;" /></div><div class="field-group"><label class="field-label">Color</label><input type="color" value="#ffffff" style="width:100%;height:38px;border-radius:8px;border:none;" /></div>`,
  captions: `<div class="flex items-center justify-between mb-16"><span class="text-sm">Auto captions</span><input type="checkbox" id="captions-toggle" checked /></div><p class="text-muted text-sm mb-16">Language: Indonesian (auto-detected)</p><div class="field-group"><label class="field-label">Style preview</label><div class="card" style="text-align:center;background:#000;color:#fff;font-weight:800;padding:14px;">SAMPLE CAPTION</div></div>`,
  effects: `<div class="grid" style="grid-template-columns:1fr 1fr;gap:8px;"><button class="btn-secondary">Zoom</button><button class="btn-secondary">Blur BG</button><button class="btn-secondary">Face Track</button><button class="btn-secondary">Fade</button></div>`,
};
document.getElementById('tool-panel').innerHTML = toolPanels.text;
content.querySelectorAll('.editor-tool-tabs button').forEach(btn => btn.addEventListener('click', () => {
  content.querySelectorAll('.editor-tool-tabs button').forEach(b => b.classList.remove('is-active'));
  btn.classList.add('is-active');
  document.getElementById('tool-panel').innerHTML = toolPanels[btn.dataset.tool];
}));

document.querySelectorAll('[data-ratio]').forEach(btn => btn.addEventListener('click', () => {
  state.aspectRatio = btn.dataset.ratio;
  document.querySelectorAll('[data-ratio]').forEach(b => b.style.borderColor = 'var(--border-subtle)');
  btn.style.borderColor = 'var(--accent)';
  updatePreviewFrame();
}));
document.getElementById('speed-slider').addEventListener('input', (e) => { state.speed = parseFloat(e.target.value); document.getElementById('speed-val').textContent = state.speed.toFixed(1) + 'x'; });
document.getElementById('volume-slider').addEventListener('input', (e) => { state.volume = parseFloat(e.target.value); document.getElementById('volume-val').textContent = Math.round(state.volume * 100) + '%'; });
document.getElementById('caption-style-select').addEventListener('change', (e) => { state.captionStyle = e.target.value; });

function updatePreviewFrame() {
  const preview = document.getElementById('editor-preview');
  const ratios = { '9:16': '203px / 360px', '16:9': '360px / 203px', '1:1': '300px / 300px' };
  preview.innerHTML = clip
    ? `<img src="${clip.thumbnail}" style="aspect-ratio:${ratios[state.aspectRatio]};object-fit:cover;border-radius:8px;max-height:90%;" />`
    : `<div class="empty-state"><h3>No clip selected</h3><p>Open a clip from AI Clips to edit it here.</p></div>`;
}

document.getElementById('tool-split').addEventListener('click', () => showToast('Split point added at playhead.', 'success'));
document.getElementById('tool-trim').addEventListener('click', () => showToast('Trimmed to current selection.', 'success'));
document.getElementById('tool-delete').addEventListener('click', () => showToast('Segment deleted.', 'info'));
document.getElementById('tool-duplicate').addEventListener('click', () => showToast('Segment duplicated.', 'info'));

document.getElementById('btn-export').addEventListener('click', async () => {
  if (!clip) return showToast('No clip loaded to export.', 'error');
  const btn = document.getElementById('btn-export');
  btn.disabled = true; btn.textContent = 'Rendering…';
  try {
    const result = await Api.post(`/api/clips/${clip.id}/export`, { aspectRatio: state.aspectRatio });
    if (result.demo) showToast(result.message, 'info');
    else { showToast('Export complete!', 'success'); window.open(result.export.path, '_blank'); }
  } catch (err) { showToast(err.message, 'error'); }
  finally { btn.disabled = false; btn.textContent = 'Export video'; }
});

async function loadClip() {
  if (!clipId || !projectId) { updatePreviewFrame(); return; }
  try {
    const { clips } = await Api.get(`/api/projects/${projectId}/clips`);
    clip = clips.find(c => c.id === clipId);
    if (clip) { document.getElementById('timeline-range').textContent = `${formatDuration(0)} – ${formatDuration(clip.duration)}`; document.querySelector('#clip-video').textContent = clip.title; }
    updatePreviewFrame();
  } catch (err) { showToast(err.message, 'error'); }
}
loadClip();
</script>
</body>
</html>
