name: Release Gomouse Pro

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name for this release (e.g. 1.2.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          # See build.yml for why this is off for now.
          cache-disabled: true

      - name: Regenerate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Resolve version name
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.version_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # Signing secrets are optional. When all four are present we build a
      # properly signed release APK; when any are missing we deliberately do
      # NOT fabricate a signing config (see app/build.gradle) and fall back
      # to a debug build instead, clearly labelled below and in the release
      # notes. See README > "Membuat release APK bertanda tangan" for how to
      # add the four secrets.
      - name: Check for release signing secrets
        id: signing
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
          HAS_STORE_PW: ${{ secrets.KEYSTORE_PASSWORD != '' }}
          HAS_ALIAS: ${{ secrets.KEY_ALIAS != '' }}
          HAS_KEY_PW: ${{ secrets.KEY_PASSWORD != '' }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ] && [ "$HAS_STORE_PW" = "true" ] && [ "$HAS_ALIAS" = "true" ] && [ "$HAS_KEY_PW" = "true" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.signing.outputs.available == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "GOMOUSE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=${{ steps.version.outputs.name }} \
            --stacktrace

      - name: Build debug APK (no signing secrets configured)
        if: steps.signing.outputs.available == 'false'
        run: |
          echo "::warning::KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD are not all set — publishing a DEBUG APK instead of a signed release. See README for how to add real signing secrets."
          ./gradlew assembleDebug \
            -PversionCode=${{ github.run_number }} \
            -PversionName=${{ steps.version.outputs.name }} \
            --stacktrace

      - name: Locate build output
        id: find_apk
        run: |
          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          else
            APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          fi
          if [ -z "$APK" ]; then
            echo "::error::No APK found to release"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gomouse-pro-${{ steps.version.outputs.name }}
          path: ${{ steps.find_apk.outputs.path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Gomouse Pro v${{ steps.version.outputs.name }}
          files: ${{ steps.find_apk.outputs.path }}
          generate_release_notes: true
          body: |
            ${{ steps.signing.outputs.available == 'true' && 'Signed release build.' || '⚠️ No release-signing secrets were configured, so this build is an unsigned/debug APK — fine for sideloading and testing, but see README > "Membuat release APK bertanda tangan" to publish a properly signed build.' }}
