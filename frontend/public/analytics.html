<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Analytics — Vidzly</title><meta name="theme-color" content="#0a0a0f" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" /><link rel="stylesheet" href="/css/style.css" /></head>
<body>
<div id="app-shell"></div>
<script src="/js/app.js"></script>
<script>
const content = requireShell('Analytics');
content.innerHTML = `<div id="analytics-note" class="mb-16"></div><div class="grid grid--stats mb-24" id="analytics-stats">${Array(4).fill('<div class="card skeleton" style="height:80px;"></div>').join('')}</div><div class="card"><div class="section-title">Views (last 7 days)</div><div id="chart-bars" class="flex items-end gap-8" style="height:140px;"></div></div>`;

Api.get('/api/analytics').then((a) => {
  if (a.isDemo) document.getElementById('analytics-note').innerHTML = `<div class="chip chip--muted">ℹ️ Showing sample analytics data (Demo Mode)</div>`;
  else if (a.note) document.getElementById('analytics-note').innerHTML = `<div class="chip chip--muted">ℹ️ ${escapeHtml(a.note)}</div>`;

  document.getElementById('analytics-stats').innerHTML = `
    ${statCard('Total Views', a.totalViews != null ? a.totalViews.toLocaleString('id-ID') : '—')}
    ${statCard('Clips Created', a.clipsCreated)}
    ${statCard('Avg Clip Length', formatDuration(a.avgClipLength))}
    ${statCard('Exports', a.exportCount)}
  `;
  const bars = a.viewsByDay || [0,0,0,0,0,0,0];
  const max = Math.max(...bars, 1);
  document.getElementById('chart-bars').innerHTML = bars.map(v => `<div style="flex:1;height:${Math.max(4,(v/max)*100)}%;background:var(--gradient-brand);border-radius:6px 6px 0 0;" title="${v}"></div>`).join('');
}).catch(err => showToast(err.message, 'error'));
function statCard(label, value) { return `<div class="card stat-card"><span class="stat-card__label">${label}</span><span class="stat-card__value">${value}</span></div>`; }
</script>
</body></html>
